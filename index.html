// ─── NAV ────────────────────────────────────────────────────────────────────
function Nav({ theme, setVariant, tweaks }) {
  const [scrolled, setScrolled] = React.useState(false);
  const [mobileOpen, setMobileOpen] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = ['services','about','testimonials','contact'];
  const scrollTo = (id) => { setMobileOpen(false); document.getElementById(id)?.scrollIntoView({block:'start'}); };
  return (
    <nav style={{
      position:'fixed',top:0,left:0,right:0,zIndex:100,
      background: scrolled ? theme.navBg : 'transparent',
      backdropFilter: scrolled ? 'blur(16px)' : 'none',
      borderBottom: scrolled ? `1px solid ${theme.border}` : 'none',
      transition:'all 0.3s ease',
    }}>
      <div style={{maxWidth:1200,margin:'0 auto',padding:'0 32px',display:'flex',alignItems:'center',justifyContent:'space-between',height:72}}>
        <div style={{display:'flex',alignItems:'center'}}>
          <img src="uploads/Galmat Signature.png" alt="Galmat Dispatch Service" style={{height:52,filter: tweaks.variant==='light' ? 'none' : 'invert(1)',transition:'filter 0.3s'}}/>
        </div>
        {/* Desktop Links */}
        <div style={{display:'flex',alignItems:'center',gap:36,display:'flex'}} className="desktop-nav">
          {links.map(l => (
            <button key={l} onClick={() => scrollTo(l)} style={{background:'none',border:'none',cursor:'pointer',color:theme.textMuted,fontFamily:'DM Sans',fontSize:14,fontWeight:500,letterSpacing:'0.5px',textTransform:'uppercase',transition:'color 0.2s'}}>
              {l}
            </button>
          ))}
          <button onClick={() => scrollTo('contact')} style={{background:theme.accent,color:'#fff',border:'none',borderRadius:6,padding:'10px 22px',fontFamily:'DM Sans',fontSize:14,fontWeight:600,cursor:'pointer',letterSpacing:'0.3px',transition:'background 0.2s'}}>
            Get a Quote
          </button>
        </div>
        {/* Mobile menu btn */}
        <button onClick={()=>setMobileOpen(!mobileOpen)} style={{display:'none',background:'none',border:'none',color:theme.text,cursor:'pointer'}} className="mobile-menu-btn">
          {mobileOpen ? <IconClose/> : <IconMenu/>}
        </button>
      </div>
      {/* Mobile dropdown */}
      {mobileOpen && (
        <div style={{background:theme.navBg,backdropFilter:'blur(16px)',borderTop:`1px solid ${theme.border}`,padding:'16px 32px 24px'}}>
          {links.map(l => (
            <button key={l} onClick={()=>scrollTo(l)} style={{display:'block',width:'100%',textAlign:'left',background:'none',border:'none',cursor:'pointer',color:theme.textMuted,fontFamily:'DM Sans',fontSize:15,fontWeight:500,padding:'12px 0',borderBottom:`1px solid ${theme.border}`}}>
              {l.charAt(0).toUpperCase()+l.slice(1)}
            </button>
          ))}
          <button onClick={()=>scrollTo('contact')} style={{marginTop:16,width:'100%',background:theme.accent,color:'#fff',border:'none',borderRadius:6,padding:'13px',fontFamily:'DM Sans',fontSize:15,fontWeight:600,cursor:'pointer'}}>
            Get a Quote
          </button>
        </div>
      )}
      <style>{`
        @media(max-width:768px){
          .desktop-nav{display:none!important;}
          .mobile-menu-btn{display:flex!important;}
        }
      `}</style>
    </nav>
  );
}

// ─── SERVICES ───────────────────────────────────────────────────────────────
const SERVICES = [

  {icon:<IconGrid/>,title:"Flatbed",sub:"All Configurations",desc:"Open-deck freight handling with specialized load planning. We find high-paying flatbed loads nationwide."},
  {icon:<IconSnow/>,title:"Reefer",sub:"Temperature-Controlled",desc:"Cold chain dispatching with temperature monitoring coordination. Perishables, pharmaceuticals, and more."},
  {icon:<IconLayers/>,title:"Step Deck & Lowboy",sub:"Oversized & Heavy Haul",desc:"Permit coordination, route planning, and load booking for oversize and overweight freight."},
];

function Services({ theme }) {
  const [hovered, setHovered] = React.useState(null);
  return (
    <section id="services" style={{background:theme.bgSecondary,padding:'100px 32px'}}>
      <div style={{maxWidth:1200,margin:'0 auto'}}>
        <div style={{marginBottom:64}}>
          <div style={{fontFamily:'DM Sans',fontSize:13,fontWeight:600,color:theme.accent,letterSpacing:'2px',textTransform:'uppercase',marginBottom:16}}>What We Dispatch</div>
          <h2 style={{fontFamily:'Barlow Condensed',fontWeight:800,fontSize:'clamp(36px,5vw,60px)',color:theme.text,letterSpacing:'-0.5px',textTransform:'uppercase',lineHeight:1}}>Our Services</h2>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:24}}>
          {SERVICES.map((s,i)=>(
            <div key={i} onMouseEnter={()=>setHovered(i)} onMouseLeave={()=>setHovered(null)} style={{
              background: hovered===i ? theme.bgCardHover : theme.bgCard,
              border:`1px solid ${hovered===i ? theme.accent+'50' : theme.border}`,
              borderRadius:12,padding:'36px 32px',
              transition:'all 0.25s ease',
              cursor:'default',
              transform: hovered===i ? 'translateY(-4px)' : 'none',
              boxShadow: hovered===i ? `0 12px 40px ${theme.accentGlow}` : 'none',
            }}>
              <div style={{color:theme.accent,marginBottom:20}}>{s.icon}</div>
              <div style={{fontFamily:'Barlow Condensed',fontWeight:700,fontSize:26,color:theme.text,letterSpacing:'-0.3px',textTransform:'uppercase',marginBottom:4}}>{s.title}</div>
              <div style={{fontFamily:'DM Sans',fontSize:12,fontWeight:600,color:theme.accent,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:16}}>{s.sub}</div>
              <p style={{color:theme.textMuted,fontSize:15,lineHeight:1.7}}>{s.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── APP ────────────────────────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('galmat-tweaks') || '{}'); } catch(e) { return {}; }})();
  const [tweaks, setTweaksRaw] = React.useState({...TWEAK_DEFAULTS, ...saved});
  const [showTweaks, setShowTweaks] = React.useState(false);

  const setTweaks = (updater) => {
    setTweaksRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : {...prev,...updater};
      localStorage.setItem('galmat-tweaks', JSON.stringify(next));
      window.parent.postMessage({type:'__edit_mode_set_keys', edits: next}, '*');
      return next;
    });
  };

  React.useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
  }, []);

  const theme = themes[tweaks.variant] || themes.dark;

  return (
    <div style={{background:theme.bg,color:theme.text,minHeight:'100vh',transition:'background 0.4s, color 0.4s'}}>
      <Nav theme={theme} tweaks={tweaks} setVariant={(v)=>setTweaks(t=>({...t,variant:v}))}/>
      <Hero theme={theme}/>
      <StatsBar theme={theme}/>
      <Services theme={theme}/>
      <About theme={theme}/>
      <Testimonials theme={theme}/>
      <Contact theme={theme}/>
      <Footer theme={theme}/>
      {showTweaks && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} theme={theme}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
